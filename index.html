<!DOCTYPE html>
<html lang="ja">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ピョンピョン育成ゲーム</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            overflow-y: auto;
            /* スクロールバーを必要に応じて表示 */
            background-size: cover;
            /* 背景画像を画面全体に表示 */
            background-repeat: no-repeat;
            /* 背景画像を繰り返さない */
            background-position: center;
            /* 背景画像を中央に配置 */
            /* Prevent text selection */
            -webkit-user-select: none;
            /* Chrome, Safari, Opera */
            -moz-user-select: none;
            /* Firefox */
            -ms-user-select: none;
            /* IE 10+ */
            user-select: none;
            /* Standard syntax */
        }

        #message {
            background-color: rgba(144, 144, 144, 0.521);
            font-size: 32px;
            font-weight: bold;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
            margin-top: 20px;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        img {
            width: 200px;
            height: auto;
            position: relative;
            /* 位置を相対的に設定 */
            margin: 0 auto;
            /* 中央に配置 */
            display: block;
            /* ブロック要素として扱う */
        }

        button {
            margin: 5px;
            padding: 10px 20px;
            font-size: 16px;
            position: relative;
            z-index: 10;
            background-color: #ff69b4;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #ff1493;
            transform: scale(1.05);
        }

        .food-selection {
            display: none;
            margin-top: 20px;
            text-align: center;
            /* フルーツを中央に配置 */
        }

        .food-item {
            width: 100px;
            height: auto;
            margin: 5px;
            cursor: pointer;
            display: inline-block;
            /* フルーツを横に並べる */
        }

        .floating-text {
            position: absolute;
            animation: floatUpLeft 2s ease-out forwards;
            font-size: 32px;
            /* サイズを大きく */
            color: #ff69b4;
        }

        @keyframes floatUpLeft {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }

            50% {
                transform: translate(-50px, -50px) scale(1.1);
            }

            100% {
                transform: translate(-100px, -100px) scale(1);
                opacity: 0;
            }
        }

        .sanpo-animation {
            position: absolute;
            bottom: 10%;
            /* 画面内に収まるように調整 */
            left: 0;
            animation: sanpoMove 3s ease-in-out forwards;
        }

        @keyframes sanpoMove {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(50vw, -20vh) scale(1.2);
            }

            100% {
                transform: translate(100vw, 0) scale(1);
            }
        }

        .brush {
            position: absolute;
            width: 100px;
            height: auto;
            cursor: pointer;
        }

        .storybook {
            display: flex;
            height: 80vh;
            /* 高さを少し小さくしてボタンが見えるように */
            align-items: center;
            /* 垂直方向に中央揃え */
        }

        .storybook img {
            width: 40%;
            /* さらに小さくして見切れないように */
            height: 100%;
            object-fit: contain;
        }

        .storybook-text {
            width: 60%;
            padding: 20px;
            background-color: white;
            text-align: left;
            font-size: 24px;
            position: relative;
        }

        .next-page-button {
            position: absolute;
            right: 20px;
            bottom: 20px;
        }

        .toilet-scene {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }

        .toilet-scene img {
            width: 150px;
            /* ピョンピョンと同じくらいの大きさに設定 */
            height: auto;
            margin: 0 10px;
            /* 画像間のスペースを設定 */
        }

        @keyframes jumpAnimation {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-30px);
            }
        }

        /* PC Layout adjustments */
        .main-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            height: 70vh;
            /* Adjust height to fit screen */
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        #action-buttons {
            width: 40%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
        }

        #pyonpyon {
            object-fit: contain;
            /* margin adjustments handled by flex */
        }

        @media (max-width: 600px) {
            .main-container {
                flex-direction: column;
                height: auto;
            }

            #action-buttons {
                width: 100%;
            }

            body {
                font-size: 14px;
                /* Adjust font size for smaller screens */
            }

            #message {
                font-size: 24px;
                /* Smaller message font size */
            }

            button {
                padding: 8px 16px;
                /* Adjust button padding */
                font-size: 14px;
                /* Smaller button font size */
            }

            img {
                width: 80%;
                /* Make images responsive */
                height: auto;
                /* Maintain aspect ratio */
            }

            .food-item {
                width: 70%;
                /* Adjust food item size */
            }

            .storybook img {
                width: 80%;
                /* Adjust storybook image size */
            }
        }
    </style>
</head>

<body>
    <h1>ピョンピョンの おせわゲーム</h1>
    <div id="happiness-display"
        style="position: absolute; top: 10px; right: 20px; font-size: 24px; font-weight: bold; color: #ff69b4;">
        <span id="heart-icon">❤</span> <span id="happiness-value">0</span>
    </div>
    <div class="main-container">
        <img id="pyonpyon" src="pyonpyon.png" alt="ピョンピョン">
        <div id="action-buttons">
            <button onclick="takeForWalk()">さんぽ</button>
            <button onclick="showFoodSelection()">ごはん</button>
            <button onclick="brushTeeth()">はみがき</button>
            <button onclick="readBook()">えほん</button>
            <button onclick="goToToilet()">トイレ</button>

            <button onclick="jump()">ジャンプ</button>
            <button onclick="sleep()">ねる</button>
        </div>
        <div id="food-selection" class="food-selection">
            <img id="food-apple" src="apple.jpg" alt="りんご" class="food-item">
            <img id="food-mikan" src="mikan.jpg" alt="みかん" class="food-item">
            <img id="food-strawberry" src="strawberry.jpg" alt="いちご" class="food-item">
            <img id="food-grape" src="grape.jpg" alt="ぶどう" class="food-item">
            <img id="food-banana" src="banana.jpg" alt="バナナ" class="food-item">
            <p>どれを たべさせて あげますか？</p>
            <button onclick="finishEating()">もどる</button> <!-- もどるボタンを追加 -->
        </div>
    </div>

    <div id="sleep-overlay" onclick="showHeartsInSleep()"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background-color:rgba(0,0,0,0.8); z-index:100; flex-direction:column; justify-content:center; align-items:center;">
        <img id="sleeping-img" src="pyonpyon_sleeping.png" alt="おやすみ"
            style="width: 300px; height: auto; animation: breathe 3s infinite ease-in-out;">
        <div style="color:white; font-size:24px; margin-top:20px;">Zzz...</div>
        <button onclick="wakeUp(); event.stopPropagation();" style="margin-top:20px; font-size: 20px;">おきる</button>
    </div>

    <div id="evolution-overlay"></div>

    <style>
        @keyframes flashPink {
            0% {
                filter: sepia(1) hue-rotate(310deg) saturate(4) brightness(1.2);
            }

            50% {
                filter: sepia(1) hue-rotate(310deg) saturate(8) brightness(1.5);
            }

            100% {
                filter: sepia(1) hue-rotate(310deg) saturate(4) brightness(1.2);
            }
        }

        @keyframes restoreColor {
            0% {
                filter: brightness(100);
            }

            100% {
                filter: brightness(1);
            }
        }

        .born {
            animation: restoreColor 3s ease-in-out forwards;
        }

        .evolving {
            animation: flashPink 0.5s ease-in-out infinite alternate;
            /* ピンク色に発光し続ける */
        }

        #evolution-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            opacity: 0;
            transition: opacity 1s;
            z-index: 9998;
            pointer-events: none;
        }

        #evolution-overlay.active {
            opacity: 0.8;
            pointer-events: all;
        }

        @keyframes breathe {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }
    </style>
    <p id="message"></p>
    <script>
        // Disable right-click context menu
        document.addEventListener('contextmenu', function (event) {
            event.preventDefault();
        });

        // BGMの再生

        document.getElementById('pyonpyon').addEventListener('click', function () {
            const bgm = new Audio('candy_peach.mid');
            bgm.loop = true;
            bgm.play();
        });

        let happiness = 0;
        let isAnimating = false; // アニメーション中かどうかを追跡
        let eatenFoods = new Set(); // 食べたものを記録
        let currentPage = 0; // 現在のページ


        const storyPages = ["『みくちゃんの うちで あそぼう！』",
            "きょうは、みくちゃんの うちに、ピカとキティとニャンニャンが あそびにやってきました。みんなとっても たのしみ！",
            "まずは、みんなで おりょうりをしました。おいしいクッキーがやけて、みんな おおよろこび！",
            "つぎは かくれんぼ！ピカはカーテンの うしろ、キティはソファの うしろ、ニャンニャンは たなのなかに かくれました。",
            "たくさん あそんで、よるに なりました。きょうは おとまり。ふかふかの おふとんで、みんなでぐっすり ねました。",
            "あさになり、「また あそぼうね！」と やくそくして、みんな えがおで バイバイしました。"
        ];

        function updateMessage(msg) {
            document.getElementById('message').innerText = msg;
        }

        function showFloatingText(text) {
            if (isAnimating) return; // アニメーション中は新しいアニメーションを開始しない
            isAnimating = true;

            const floatingText = document.createElement('div');
            floatingText.className = 'floating-text';
            floatingText.innerText = text;
            document.body.appendChild(floatingText);

            // Set initial position near the middle left of the pyonpyon image
            const pyonpyon = document.getElementById('pyonpyon');
            const rect = pyonpyon.getBoundingClientRect();

            floatingText.style.left = `${rect.left + window.scrollX - 20}px`; // 画像の左側に配置

            floatingText.style.top = `${rect.top + window.scrollY + rect.height / 2}px`; // 画像の中央に配置

            // Remove the text after animation
            setTimeout(() => {
                floatingText.remove();
                isAnimating = false;
            }

                , 2000);
        }


        function takeForWalk() {
            // メッセージをクリア
            updateMessage(""); // 散歩イベントに入る際にメッセージを消す
            document.querySelector('.main-container').style.display = 'none';
            // pyonpyon element is inside main-container, so we need a separate way to animate it or clone it for walk?
            // Wait, existing logic uses #pyonpyon. If we hide main-container, #pyonpyon is hidden.
            // For walk, we likely want to just hide the buttons and change BG, but keep pyonpyon?
            // The original logic was: action-buttons none, body bg change, pyonpyon stays.
            // So for walk, we should NOT hide main-container, but hide action-buttons.
            // But wait, #pyonpyon is inside .main-container which is flex centered.
            // Walk animation moves the element absolutely or via translate.

            // Let's modify approach for Walk: Hide action-buttons, modify main-container style to allow free movement?
            // Or move pyonpyon out?

            // Simpler for now: just hide action-buttons and allow pyonpyon (which is in main-container) to move.
            // But main-container has centering. 
            // Let's hide main-container and append a temporary walker pyonpyon? NO, that loses state.

            // Adjusted Plan for Walk:
            document.getElementById('action-buttons').style.display = 'none';
            // We need to reset flex centering effect or take pyonpyon out of flow?
            // Actually, if actions are hidden, pyonpyon is alone in flex container. Main container has height 70vh.
            // Walk uses absolute positioning logic or transforms?
            // Original logic: relative position, margin auto.
            // Walk logic: randomMove modifies transform.

            // Let's make main-container not restrain it during walk?
            const container = document.querySelector('.main-container');
            container.style.display = 'block'; // Disable flex centering for walk mode
            container.style.height = '100vh';

            const pyonpyon = document.getElementById('pyonpyon');
            pyonpyon.style.position = 'absolute'; // Free movement
            pyonpyon.style.top = '50%';
            pyonpyon.style.left = '50%';
            pyonpyon.style.margin = '-100px 0 0 -100px'; // Center roughly

            document.body.style.backgroundImage = "url('sanpo.jpg')";

            let walkCount = 0;
            let jumpCount = 0;

            function playJumpSound() {
                const jumpSound = new Audio('jump07.mp3');
                jumpSound.play();
            }

            function initialJump() {
                if (jumpCount < 3) {
                    pyonpyon.style.animation = 'jumpAnimation 0.5s ease-in-out 1';
                    playJumpSound();
                    jumpCount++;

                    setTimeout(() => {
                        pyonpyon.style.animation = '';
                        initialJump();
                    }

                        , 500); // ジャンプアニメーションの時間に合わせる
                }

                else {
                    randomMove();
                }
            }

            function randomMove() {
                if (walkCount >= 3) {
                    // もどるボタンを追加
                    const returnButton = document.createElement('button');
                    returnButton.innerText = "もどる";
                    returnButton.id = 'returnButton';
                    returnButton.style.position = 'fixed';
                    returnButton.style.bottom = '20px';
                    returnButton.style.right = '20px';
                    returnButton.style.zIndex = '100';
                    returnButton.onclick = goBackHome;
                    document.body.appendChild(returnButton);

                    updateMessage("ピョンピョンは さんぽに いきました！");
                    showFloatingText("(^-^)♪");
                    return;
                }

                // ランダムに2回斜め移動
                const deltaX = (Math.random() * 300 - 150); // -150から150の範囲でランダム
                const deltaY = (Math.random() * 300 - 150); // -150から150の範囲でランダム

                const currentTransform = pyonpyon.style.transform.match(/translate\\((.*)px, (.*)px\\)/);
                const currentX = currentTransform ? parseFloat(currentTransform[1]) : 0;
                const currentY = currentTransform ? parseFloat(currentTransform[2]) : 0;

                const newX = currentX + deltaX;
                const newY = currentY + deltaY;

                pyonpyon.style.transition = 'transform 1s ease-in-out';

                pyonpyon.style.transform = `translate(${newX}px, ${newY}px)`;

                // 移動が完了した後にジャンプ
                setTimeout(() => {
                    pyonpyon.style.animation = 'jumpAnimation 0.5s ease-in-out 3'; // 3回ジャンプ

                    setTimeout(() => {
                        pyonpyon.style.animation = '';
                        walkCount++;
                        randomMove();
                    }

                        , 1500); // ジャンプアニメーションの時間に合わせる
                }

                    , 1000); // 移動時間に合わせる
            }

            initialJump();

            // さんぽでリセット（必要なら）
            // eatenFoods.clear(); // ここではクリアしない（食事画面を開くときにクリアする）
        }

        function goBackHome() {
            // 散歩完了ボーナス
            happiness += 10;
            document.getElementById('happiness-value').innerText = happiness;
            checkGrowth();

            if (isEvolving) {
                // 進化中は散歩用の一時要素（戻るボタンなど）だけ削除して、あとはcheckGrowthに任せる
                const returnButton = document.getElementById('returnButton');
                if (returnButton) returnButton.remove();
                return;
            }

            // 元の画面に戻す
            document.querySelector('.main-container').style.display = 'flex'; // Restore flex
            const container = document.querySelector('.main-container');
            container.style.height = '70vh'; // Restore height

            document.getElementById('action-buttons').style.display = 'flex'; // Restore buttons
            document.body.style.backgroundImage = "none";

            const pyonpyon = document.getElementById('pyonpyon');
            pyonpyon.style.position = 'static'; // Restore position
            pyonpyon.style.margin = '0';
            pyonpyon.style.transform = 'translate(0, 0)'; // 元の位置に戻す

            const returnButton = document.getElementById('returnButton');

            if (returnButton) {
                returnButton.remove(); // ボタンを削除
            }

            updateMessage("");

            // 散歩完了ボーナス
            happiness += 10;
            document.getElementById('happiness-value').innerText = happiness;
            checkGrowth();

            if (isEvolving) {
                const returnButton = document.getElementById('returnButton');
                if (returnButton) returnButton.remove();
                return;
            }
        }

        function showFoodSelection() {
            document.getElementById('action-buttons').style.display = 'none';
            document.getElementById('food-selection').style.display = 'block';
            // food-selection should take up the space in flex container
            // Ensure main-container is visible (it should be)
            document.querySelector('.main-container').style.display = 'flex';
            updateMessage(""); // メッセージをクリア

            // 食事セッションの開始：食べた記録をリセット
            eatenFoods.clear();

            // 全ての食材を表示状態にリセット
            document.querySelectorAll('.food-item').forEach(img => {
                img.style.display = 'inline-block';

                // Make draggable
                makeDraggable(img, {
                    onDrop: (element) => {
                        // Check if hungry
                        if (eatenFoods.size < 5) {
                            feed(element.id, element.alt);
                            return true; // Handled
                        } else {
                            updateMessage("ピョンピョンは もう おなかいっぱいです！");
                            return false; // Not handled
                        }
                    }
                });
            });

            // もどるボタンの位置を調整
            const returnButton = document.querySelector('#food-selection button');
            returnButton.style.position = 'fixed';
            returnButton.style.bottom = '20px';
            returnButton.style.right = '20px';
        }

        function brushTeeth() {
            // ボタンを非表示にして、はみがき画面を表示
            document.getElementById('action-buttons').style.display = 'none';

            // tyel.jpgを表示
            const brush = document.createElement('img');
            brush.src = 'tyel.jpg';
            brush.className = 'brush';
            brush.style.left = '30%'; // ピョンピョンに近づける
            brush.style.top = '50%';

            document.body.appendChild(brush);

            const brushSound = new Audio('brush_teeth2.mp3');

            makeDraggable(brush, {
                onDrag: (element, event) => {
                    const pyonpyon = document.getElementById('pyonpyon');
                    const pRect = pyonpyon.getBoundingClientRect();
                    const eRect = element.getBoundingClientRect();
                    const eCenterX = eRect.left + eRect.width / 2;
                    const eCenterY = eRect.top + eRect.height / 2;

                    const isHit = (eCenterX >= pRect.left && eCenterX <= pRect.right &&
                        eCenterY >= pRect.top && eCenterY <= pRect.bottom);

                    if (isHit) {
                        if (brushSound.paused) brushSound.play();
                        if (!isAnimating) showFloatingText("はみがき シュッシュ");
                    } else {
                        brushSound.pause();
                    }
                },
                onReturn: () => {
                    brushSound.pause();
                    brushSound.currentTime = 0;
                }
            });

            // もどボタンを追加
            const returnButton = document.createElement('button');
            returnButton.innerText = "もどる";
            returnButton.id = 'returnButton';

            returnButton.onclick = () => {
                brush.remove();
                returnButton.remove();

                // はみがき完了ボーナス
                happiness += 10;
                document.getElementById('happiness-value').innerText = happiness;
                checkGrowth();

                if (isEvolving) return;

                goBack();
                updateMessage("ピョンピョンは はみがきを しました！");
            };
            document.body.appendChild(returnButton);

            // メッセージをクリア
            updateMessage("ピョンピョンに はみがきを させてあげてね");

            // ピョンピョンに当たったときの処理（グローバルリスナーに任せるため、ここではリスナー追加を行わない）
            /* 
        document.getElementById('pyonpyon').addEventListener('dragover', function (event) { ... });
        document.getElementById('pyonpyon').addEventListener('drop', function (event) { ... });
        */
        }



        function readBook() {
            // 画像とボタンを非表示にする
            document.querySelector('.main-container').style.display = 'none';

            // もどボタンを削除
            const returnButton = document.getElementById('returnButton');

            if (returnButton) {
                returnButton.remove();
            }

            // メッセージをクリア
            updateMessage("");

            // 絵本の表示
            const storybook = document.createElement('div');
            storybook.className = 'storybook';
            const bookImage = document.createElement('img');

            bookImage.src = `miku${currentPage}.jpg`; // タイトル画像をmiku0.jpgに変更
            const storyText = document.createElement('div');
            storyText.className = 'storybook-text';
            storyText.innerText = storyPages[currentPage]; // タイトルを表示
            storybook.appendChild(bookImage);
            storybook.appendChild(storyText);
            document.body.appendChild(storybook);

            // 次のページボタン
            const nextPageButton = document.createElement('button');
            nextPageButton.className = 'next-page-button';
            nextPageButton.innerText = "次のページ";

            nextPageButton.onclick = () => {
                currentPage++;

                if (currentPage < storyPages.length) {
                    storyText.innerText = storyPages[currentPage];

                    bookImage.src = `miku${currentPage}.jpg`; // ページごとに画像を切り替え
                }

                else {
                    // 最後のページ
                    nextPageButton.innerText = "えほん おわり";

                    nextPageButton.onclick = () => {
                        storybook.remove();
                        nextPageButton.remove();

                        // 絵本完了ボーナス
                        happiness += 10;
                        document.getElementById('happiness-value').innerText = happiness;
                        checkGrowth();

                        if (isEvolving) return;

                        goBack();
                        updateMessage("ピョンピョンは えほんを たのしんでいます！");
                        showFloatingText("(^-^)♪");
                    }

                        ;
                }
            }

                ;
            storybook.appendChild(nextPageButton);
        }

        // 新しいドラッグ機能（Common Drag Logic）
        function makeDraggable(element, options = {}) {
            let spacer = null;

            element.ondragstart = () => false;
            element.style.touchAction = 'none'; // タッチスクロール防止

            element.onpointerdown = function (event) {
                event.preventDefault();
                element.setPointerCapture(event.pointerId);

                const rect = element.getBoundingClientRect();
                const offsetX = event.clientX - rect.left;
                const offsetY = event.clientY - rect.top;

                const style = window.getComputedStyle(element);
                const isAbsolute = style.position === 'absolute' || style.position === 'fixed';

                if (!isAbsolute) {
                    // フロー要素の場合はスペーサーを作成
                    spacer = document.createElement('div');
                    spacer.style.width = rect.width + 'px';
                    spacer.style.height = rect.height + 'px';
                    spacer.style.display = style.display;
                    spacer.style.margin = style.margin;
                    element.parentNode.insertBefore(spacer, element);

                    element.style.width = rect.width + 'px';
                    element.style.height = rect.height + 'px';

                    document.body.appendChild(element);
                    element.style.position = 'fixed';
                    element.style.left = rect.left + 'px';
                    element.style.top = rect.top + 'px';
                    element.style.zIndex = '10000';
                } else {
                    // 既にAbsoluteならZindexだけ上げる
                    element.style.zIndex = '10000';
                }

                function onPointerMove(e) {
                    element.style.left = (e.clientX - offsetX) + 'px';
                    element.style.top = (e.clientY - offsetY) + 'px';

                    if (options.onDrag) {
                        options.onDrag(element, e);
                    }
                }

                function onPointerUp(e) {
                    element.onpointermove = null;
                    element.onpointerup = null;

                    const pyonpyon = document.getElementById('pyonpyon');
                    const pRect = pyonpyon.getBoundingClientRect();
                    const eRect = element.getBoundingClientRect();
                    const eCenterX = eRect.left + eRect.width / 2;
                    const eCenterY = eRect.top + eRect.height / 2;

                    // Simple collision detection
                    const isHit = (eCenterX >= pRect.left && eCenterX <= pRect.right &&
                        eCenterY >= pRect.top && eCenterY <= pRect.bottom);

                    let handled = false;
                    if (isHit && options.onDrop) {
                        handled = options.onDrop(element);
                    }

                    if (!handled) {
                        if (options.onReturn) options.onReturn();

                        // 元に戻すアニメーション
                        if (!isAbsolute && spacer) {
                            element.style.transition = 'top 0.3s, left 0.3s';
                            const sRect = spacer.getBoundingClientRect();
                            element.style.left = sRect.left + 'px';
                            element.style.top = sRect.top + 'px';

                            setTimeout(() => {
                                element.style.transition = '';
                                element.style.position = '';
                                element.style.zIndex = '';
                                element.style.width = '';
                                element.style.height = '';
                                element.style.left = '';
                                element.style.top = '';
                                if (spacer && spacer.parentNode) spacer.replaceWith(element);
                                spacer = null;
                            }, 300);
                        } else if (isAbsolute) {
                            // Absolute elements currently stay or Logic handled by caller if needed
                            // For consistency, let's keep them where they are unless logic says otherwise
                        }
                    } else {
                        if (!isAbsolute && spacer) spacer.remove();
                    }
                }

                element.onpointermove = onPointerMove;
                element.onpointerup = onPointerUp;
            };
        }

        let growthStage = 0; // 成長段階 (0: 初期, 1: 1回目, 2: 2回目, 3: 3回目)
        let isEvolving = false;

        function checkGrowth() {
            if (isEvolving) return;

            let nextStage = -1;
            let nextImage = '';
            let nextWidth = '';
            let message = '';

            // 成長速度を早く調整: 30, 70, 120
            if (happiness >= 120 && growthStage < 3) {
                nextStage = 3;
                nextImage = 'pyonpyon_grown3.png';
                nextWidth = '350px';
                message = "ピョンピョンは さいしゅうだんかいに せいちょう しました！ すごい！";
            } else if (happiness >= 70 && growthStage < 2) {
                nextStage = 2;
                nextImage = 'pyonpyon_grown2.png';
                nextWidth = '350px';
                message = "ピョンピョンは さらに せいちょう しました！";
            } else if (happiness >= 30 && growthStage < 1) {
                nextStage = 1;
                nextImage = 'pyonpyon_grown.png';
                nextWidth = '200px';
                message = "ピョンピョンは せいちょう しました！";
            }

            if (nextStage !== -1) {
                isEvolving = true;

                // 強制的に初期画面に戻す (各シーンのクリーンアップ)
                // Toilet / Storybook / Brush elements removal
                document.querySelectorAll('.toilet-scene, .storybook').forEach(el => el.remove());
                document.querySelectorAll('.brush').forEach(el => el.remove());
                document.querySelectorAll('#returnButton, .next-page-button').forEach(el => el.remove());

                // Reset Food Selection
                document.getElementById('food-selection').style.display = 'none';

                // Reset Main Container
                document.querySelector('.main-container').style.display = 'flex';
                document.querySelector('.main-container').style.height = '70vh'; // Reset height
                document.getElementById('action-buttons').style.display = 'none'; // Hide buttons during evolution

                const pyonpyon = document.getElementById('pyonpyon');
                pyonpyon.style.display = 'block';
                pyonpyon.style.position = 'static';

                // Force reset all positioning and movement styles
                pyonpyon.style.transition = 'none'; // Disable transition for instant reset
                pyonpyon.style.top = 'auto';
                pyonpyon.style.left = 'auto';
                pyonpyon.style.right = 'auto';
                pyonpyon.style.bottom = 'auto';
                pyonpyon.style.right = 'auto';
                pyonpyon.style.bottom = 'auto';

                pyonpyon.style.transform = 'translate(0,0)';
                pyonpyon.style.margin = '0';

                pyonpyon.style.animation = ''; // 既存のアニメーションをクリア

                document.body.style.backgroundImage = 'none';

                // Overlay
                const overlay = document.getElementById('evolution-overlay');
                overlay.style.display = 'block';
                setTimeout(() => overlay.classList.add('active'), 10);

                updateMessage("おや...？ ピョンピョンのようすが...");

                pyonpyon.style.zIndex = '9999';
                pyonpyon.style.position = 'relative';
                pyonpyon.classList.add('evolving');

                // Evolution Sequence
                setTimeout(() => {
                    growthStage = nextStage;
                    pyonpyon.src = nextImage;
                    if (nextWidth) pyonpyon.style.width = nextWidth;

                    pyonpyon.classList.remove('evolving');
                    pyonpyon.classList.add('born'); // 白からフェードイン

                    // Cleanup after fade-in
                    setTimeout(() => {
                        pyonpyon.classList.remove('born');
                        overlay.classList.remove('active');

                        updateMessage(message);
                        showFloatingText("☆☆☆");

                        // Wait for fade out
                        setTimeout(() => {
                            overlay.style.display = 'none';
                            pyonpyon.style.zIndex = '';
                            pyonpyon.style.position = 'static';
                            document.getElementById('action-buttons').style.display = 'flex';
                            isEvolving = false;
                        }, 1000);

                    }, 3000); // 3秒かけて白から戻るのを待つ

                }, 4000); // 4秒間点滅アニメーション
            }
        }





        function goBack() {
            if (isEvolving) return;

            document.querySelector('.main-container').style.display = 'flex'; // Restore main container
            document.getElementById('action-buttons').style.display = 'flex';
            document.getElementById('pyonpyon').style.display = 'block';
            document.getElementById('pyonpyon').style.position = 'static'; // 位置をリセット
            document.getElementById('pyonpyon').style.marginTop = '0';
            document.getElementById('food-selection').style.display = 'none';
            currentPage = 0; // ページをリセット
            updateMessage(""); // メッセージをクリア
        }
